<style>
.save-answers {
  margin: 2.5rem 0 1rem;
  padding: 1rem 1.25rem;
  border: 1px solid #ddd;
  border-radius: 6px;
  background: #f7f9f8;
}
.save-answers h2 { margin-top: 0; font-size: 1.25rem; }
.save-answers .btn { margin: 0.25rem 0.5rem 0.25rem 0; }
.save-answers-status { margin-left: 0.25rem; color: #2f6f62; }
</style>

<script>
// Lets students keep a copy of their answers: copy them all to the clipboard,
// or download them as an .R file they can open in RStudio. Each exercise's
// heading and task go in as comments above the code.
//
// Answers are also kept in this browser between visits, via quarto-live's
// `persist` cell option (set in each page's webr cell-options). quarto-live
// saves an editor when its code is run, not on every keystroke.
(function () {
  function editorCode(editor) {
    // quarto-live editors are CodeMirror 6; the exercises are short enough
    // that every line is rendered, so reading the lines from the page is safe.
    var lines = editor.querySelectorAll(".cm-content .cm-line");
    return Array.prototype.map.call(lines, function (l) { return l.textContent; }).join("\n");
  }

  function collectAnswers() {
    var title = (document.querySelector("h1.title") || {}).textContent || document.title;
    var out = [
      "# " + title.trim(),
      "# My answers, saved " + new Date().toLocaleString(),
      "# " + window.location.href.split("#")[0],
      "",
    ];
    var seen = new Set();
    document.querySelectorAll(".exercise-editor").forEach(function (editor) {
      var section = editor.closest("section");
      // Only the editable cell of each exercise, not its solution
      if (editor.closest(".solution, .callout, details")) return;
      if (!section || seen.has(section)) return;
      seen.add(section);
      var heading = section.querySelector("h2, h3");
      var task = section.querySelector("p");
      out.push("# " + "-".repeat(70));
      if (heading) out.push("# " + heading.textContent.trim());
      if (task) {
        task.textContent.trim().split(/\s*\n\s*/).forEach(function (l) { out.push("# " + l); });
      }
      out.push("");
      out.push(editorCode(editor));
      out.push("");
    });
    return out.join("\n");
  }

  function fileName() {
    var page = window.location.pathname.split("/").pop().replace(/\.html$/, "") || "exercises";
    return page + "-my-answers.R";
  }

  function setStatus(box, text) {
    var s = box.querySelector(".save-answers-status");
    s.textContent = text;
    clearTimeout(s._t);
    s._t = setTimeout(function () { s.textContent = ""; }, 4000);
  }

  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text);
    }
    // Fallback for older browsers, or an iframe without clipboard permission
    return new Promise(function (resolve, reject) {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      var ok = document.execCommand("copy");
      ta.remove();
      ok ? resolve() : reject(new Error("copy failed"));
    });
  }

  function init() {
    if (!document.querySelector(".exercise-editor")) {
      // Editors are created once the page's scripts run; try again shortly
      return void setTimeout(init, 500);
    }
    if (document.querySelector(".save-answers")) return;

    var box = document.createElement("div");
    box.className = "save-answers";
    box.id = "save-answers";
    box.innerHTML =
      "<h2>Save your answers</h2>" +
      "<p>Each time you click <strong>Run Code</strong>, your code is saved in this browser, so it will still be here " +
      "if you refresh or come back later (on the same computer and browser). To keep a copy anywhere else, " +
      "copy it all, or download it as an R script you can open in RStudio.</p>" +
      '<button type="button" class="btn btn-primary save-copy">Copy all my answers</button>' +
      '<button type="button" class="btn btn-outline-primary save-download">Download as .R file</button>' +
      '<span class="save-answers-status" role="status"></span>';

    box.querySelector(".save-copy").addEventListener("click", function () {
      copyText(collectAnswers()).then(
        function () { setStatus(box, "Copied. Paste it into a document or an R script."); },
        function () { setStatus(box, "Couldn't copy: try the download button instead."); }
      );
    });
    box.querySelector(".save-download").addEventListener("click", function () {
      var blob = new Blob([collectAnswers()], { type: "text/plain" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = fileName();
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
      setStatus(box, "Downloaded " + fileName());
    });

    var main = document.querySelector("main") || document.body;
    main.appendChild(box);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
